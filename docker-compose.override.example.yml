# Optional local settings for browser cookies. Copy this file to
# docker-compose.override.yml and set CLIPPYME_FIREFOX_PROFILE_HOST_PATH in
# .env (or in the shell) to the host Firefox profile directory. The copied
# file is ignored by Git because it points to private browser data.
#
# Windows PowerShell example:
#   $env:CLIPPYME_FIREFOX_PROFILE_HOST_PATH =
#     (Join-Path $env:APPDATA 'Mozilla/Firefox/Profiles/xxxxxxxx.default-release')
# Linux example:
#   export CLIPPYME_FIREFOX_PROFILE_HOST_PATH="$HOME/.mozilla/firefox/xxxxxxxx.default-release"
services:
  backend:
    environment:
      CLIPPYME_FIREFOX_PROFILE: /firefox-profile
      # If zernio.com closes TLS connections on your network, use its API host:
      # ZERNIO_BASE_URL: https://api.zernio.com/api/v1
    volumes:
      - type: bind
        source: "${CLIPPYME_FIREFOX_PROFILE_HOST_PATH:?Set CLIPPYME_FIREFOX_PROFILE_HOST_PATH to your Firefox profile directory}"
        target: /firefox-profile
        read_only: true
    dns:
      - 172.30.245.53
    networks:
      - clippyme-net
      - dns-net
    depends_on:
      dnsproxy:
        condition: service_started

  dnsproxy:
    image: adguard/dnsproxy@sha256:947f677c949acded008a938e7cd1b666579b16b56db5f53eb8136a63d2783e5a
    command: ["-l", "0.0.0.0", "-p", "53", "-u", "https://1.1.1.1/dns-query", "--cache"]
    networks:
      dns-net:
        ipv4_address: 172.30.245.53
    restart: unless-stopped

networks:
  dns-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.245.0/24
